name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Fetch pinned official Skill validator
        shell: bash
        run: |
          curl --fail --location --silent --show-error --retry 2 --connect-timeout 10 --max-time 60 \
            https://raw.githubusercontent.com/openai/skills/49f948faa9258a0c61caceaf225e179651397431/skills/.system/skill-creator/scripts/quick_validate.py \
            --output "$RUNNER_TEMP/quick_validate.py"
          echo "6cc9dc3199c935916cf6f73fcbbbb0e3bb1b58c8f5109fefa499978908164f51  $RUNNER_TEMP/quick_validate.py" | sha256sum --check
      - run: bash scripts/check.sh --full
        env:
          CONVERGE_QUICK_VALIDATE: ${{ runner.temp }}/quick_validate.py
